name: Deploy Infrastructure

# terraform apply toca a nuvem — apenas push em main (terraform/**).
# destroy: workflow_dispatch manual exclusivamente.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: Digite DESTRUIR-tech-challenge-infra-kubernetes para confirmar destroy
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.8
  TF_ENVIRONMENT: producao
  TF_STATE_KEY: tech-challenge-infra-kubernetes/producao/terraform.tfstate

concurrency:
  group: terraform-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validar confirmação de destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTRUIR-tech-challenge-infra-kubernetes" ]; then
            echo "Confirmação de destroy inválida ou ausente."
            echo "Digite exatamente: DESTRUIR-tech-challenge-infra-kubernetes"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
        working-directory: terraform

      - name: Terraform Plan
        if: github.event_name == 'push' || github.event.inputs.action == 'apply' || github.event.inputs.action == 'plan'
        run: |
          set -o pipefail
          terraform plan -no-color \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -var="lambda_s3_bucket=${{ secrets.LAMBDA_ARTIFACTS_BUCKET }}" \
            -var="sendgrid_api_key=${{ secrets.SENDGRID_API_KEY }}" \
            -var="datadog_api_key=${{ secrets.DATADOG_API_KEY }}" \
            -var="datadog_app_key=${{ secrets.DATADOG_APP_KEY }}" \
            -out=tfplan 2>&1 | tee plan-output.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          if [ "$PLAN_EXIT" -ne 0 ]; then
            echo "--- terraform plan failed (exit ${PLAN_EXIT}) ---"
            grep -E "^Error:" plan-output.txt || true
            exit "$PLAN_EXIT"
          fi
        working-directory: terraform

      - name: Upload plan artifact
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: terraform/tfplan
          retention-days: 30

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -var="lambda_s3_bucket=${{ secrets.LAMBDA_ARTIFACTS_BUCKET }}" \
            -var="sendgrid_api_key=${{ secrets.SENDGRID_API_KEY }}" \
            -var="datadog_api_key=${{ secrets.DATADOG_API_KEY }}" \
            -var="datadog_app_key=${{ secrets.DATADOG_APP_KEY }}"
        working-directory: terraform

      - name: Smoke test — SSM exports
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          aws ssm get-parameter --name "${PREFIX}/infra/vpc_id"
          aws ssm get-parameter --name "${PREFIX}/infra/eks_cluster_name"
          aws ssm get-parameter --name "${PREFIX}/infra/ecr_repository_url"