name: Deploy Infrastructure

# terraform apply toca a nuvem — apenas push em main.
# destroy: workflow_dispatch manual exclusivamente.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: apply
        type: choice
        options: [apply, destroy]

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.8
  TF_ENVIRONMENT: producao
  TF_STATE_KEY: tech-challenge-infra-kubernetes/producao/terraform.tfstate

concurrency:
  group: terraform-${{ env.TF_ENVIRONMENT }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
        working-directory: terraform

      - name: Terraform Plan
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          terraform plan -no-color \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="db_secret_arn=${{ secrets.DB_SECRET_ARN }}" \
            -var="lambda_s3_bucket=${{ secrets.LAMBDA_ARTIFACTS_BUCKET }}" \
            -var="sendgrid_api_key=${{ secrets.SENDGRID_API_KEY }}" \
            -var="datadog_api_key=${{ secrets.DATADOG_API_KEY }}" \
            -var="datadog_app_key=${{ secrets.DATADOG_APP_KEY }}" \
            -out=tfplan
        working-directory: terraform

      - name: Upload plan artifact
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: terraform/tfplan
          retention-days: 30

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="db_secret_arn=${{ secrets.DB_SECRET_ARN }}" \
            -var="lambda_s3_bucket=${{ secrets.LAMBDA_ARTIFACTS_BUCKET }}" \
            -var="sendgrid_api_key=${{ secrets.SENDGRID_API_KEY }}" \
            -var="datadog_api_key=${{ secrets.DATADOG_API_KEY }}" \
            -var="datadog_app_key=${{ secrets.DATADOG_APP_KEY }}"
        working-directory: terraform

      - name: Smoke test — SSM exports
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          aws ssm get-parameter --name "${PREFIX}/infra/vpc_id"
          aws ssm get-parameter --name "${PREFIX}/infra/eks_cluster_name"
          aws ssm get-parameter --name "${PREFIX}/infra/ecr_repository_url"

  update-lambda-env:
    name: Update Lambda DB Secret
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' || github.event.inputs.action == 'apply'
    environment: producao
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update auth Lambda when DB secret exists
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          DB_ARN=$(aws ssm get-parameter --name "${PREFIX}/database/db_secret_arn" --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ -z "$DB_ARN" ]; then
            echo "DB secret ainda nao publicado pelo repo database. Pulando."
            exit 0
          fi
          JWT_ARN=$(aws ssm get-parameter --name "${PREFIX}/infra/jwt_secret_arn" --query Parameter.Value --output text)
          LAMBDA=$(aws ssm get-parameter --name "${PREFIX}/infra/lambda_auth_function_name" --query Parameter.Value --output text)
          TABLE=$(aws ssm get-parameter --name "${PREFIX}/infra/auth_rate_limit_table" --query Parameter.Value --output text)
          aws lambda update-function-configuration \
            --function-name "$LAMBDA" \
            --environment "Variables={DB_SECRET_ARN=${DB_ARN},JWT_SECRET_ARN=${JWT_ARN},AUTH_RATE_LIMIT_TABLE=${TABLE},NODE_ENV=${{ env.TF_ENVIRONMENT }}"
          aws lambda wait function-updated --function-name "$LAMBDA"
